name: Evidence-linked recovery-01 package

on:
  pull_request:
    branches: ['feature/step-1-project-setup']
    paths:
      - 'tools/staging-recovery/**'
      - '.github/workflows/staging-recovery.yml'

permissions:
  contents: read

jobs:
  windows-package:
    name: Pinned CLI safeguards, native DPAPI and evidence-linked recovery-01 ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
      TEST_DATABASE_TOKEN: ''
      LIVE_MODE_ENABLED: 'false'
      ALLOWED_PROVIDERS: simulator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked build dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts
      - name: Build pinned issuance package outside checkout
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VaultX Recovery-01 & Offline'
          "RECOVERY_PACKAGE=$package" >> $env:GITHUB_ENV
          node tools/staging-recovery/build-package.js "$package"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned build failed' }
      - name: Credential-free single-use controller, identity and native DPAPI tests
        run: node tools/staging-recovery/validate-package.js "$env:RECOVERY_PACKAGE"
      - name: Publish evidence-linked recovery-01 ZIP
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultX-Evidence-Linked-Recovery-01
          path: '${{ env.RECOVERY_PACKAGE }}/'
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Download actual uploaded artifact
        uses: actions/download-artifact@v4
        with:
          name: VaultX-Evidence-Linked-Recovery-01
          path: '${{ runner.temp }}/VaultX Recovery-01 Downloaded & Verified'
      - name: Verify downloaded contents and repeat native validation
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VaultX Recovery-01 Downloaded & Verified'
          foreach ($name in @('Start-Recovery-01.cmd','launcher.js','status-check.js','issuer.js','diagnostics.js','recovery-controller.js','worker.js','dpapi-test.js','README.txt','SHA256SUMS.json','PROVENANCE.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $name) -PathType Leaf)) { throw 'Incomplete issuance artifact' }
          }
          node tools/staging-recovery/validate-package.js "$package"
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded artifact validation failed' }
          '[Download evidence-linked recovery-01 ZIP](${{ steps.artifact.outputs.artifact-url }})' >> $env:GITHUB_STEP_SUMMARY
