name: Read-only staging preflight package

on:
  pull_request:
    branches: ['feature/step-1-project-setup']
    paths:
      - 'tools/staging-preflight/**'
      - '.github/workflows/staging-preflight-package.yml'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  windows-package:
    name: Native Windows read-only preflight validation and ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
      TEST_DATABASE_TOKEN: ''
      LIVE_MODE_ENABLED: 'false'
      ALLOWED_PROVIDERS: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts
      - name: Choose disposable package directory
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VaultX Preflight & Offline'
          "PREFLIGHT_PACKAGE=$package" >> $env:GITHUB_ENV
      - name: Build standalone package without application startup
        run: node tools/staging-preflight/build-package.js "$env:PREFLIGHT_PACKAGE"
      - name: Native PowerShell launchers, fail-closed paths and synthetic query tests
        run: node tools/staging-preflight/validate-package.js "$env:PREFLIGHT_PACKAGE"
      - name: Verify ZIP input contents and digest manifest
        shell: pwsh
        run: |
          foreach ($name in @('Start-Preflight.cmd', 'Run-Preflight.ps1', 'preflight.js', 'README.txt', 'SHA256SUMS.json', 'PROVENANCE.json', 'node_modules/pg/package.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:PREFLIGHT_PACKAGE $name) -PathType Leaf)) { throw 'Incomplete preflight package' }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $env:PREFLIGHT_PACKAGE 'SHA256SUMS.json') -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $env:PREFLIGHT_PACKAGE $entry.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw 'Package checksum mismatch' }
          }
          Write-Output 'Verified launcher, checker, instructions, provenance, runtime dependencies and checksums.'
      - name: Publish validated downloadable ZIP
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultX-ReadOnly-Preflight-Windows
          path: '${{ env.PREFLIGHT_PACKAGE }}/'
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Record authenticated artifact download link
        shell: pwsh
        run: |
          '## Validated read-only preflight package' >> $env:GITHUB_STEP_SUMMARY
          '[Download ZIP](${{ steps.artifact.outputs.artifact-url }})' >> $env:GITHUB_STEP_SUMMARY
          'No Render connection, database writes, operators or API keys were involved.' >> $env:GITHUB_STEP_SUMMARY
