name: Read-only staging operator preparation package

on:
  pull_request:
    branches: ['feature/step-1-project-setup']
    paths:
      - 'tools/staging-operator-preparation/**'
      - '.github/workflows/staging-operator-preparation.yml'

permissions:
  contents: read

jobs:
  windows-package:
    name: Pinned CLI safeguards, native DPAPI and preparation-only ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
      TEST_DATABASE_TOKEN: ''
      LIVE_MODE_ENABLED: 'false'
      ALLOWED_PROVIDERS: simulator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked build dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts
      - name: Build pinned preparation package outside checkout
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VaultX Operator Preparation & Offline'
          "PREPARATION_PACKAGE=$package" >> $env:GITHUB_ENV
          node tools/staging-operator-preparation/build-package.js "$package"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned build failed' }
      - name: Native DPAPI and credential-free read-only status simulations
        run: node tools/staging-operator-preparation/validate-package.js "$env:PREPARATION_PACKAGE"
      - name: Publish preparation-only ZIP
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultX-Staging-Operator-Preparation-ONLY
          path: '${{ env.PREPARATION_PACKAGE }}/'
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Download actual uploaded artifact
        uses: actions/download-artifact@v4
        with:
          name: VaultX-Staging-Operator-Preparation-ONLY
          path: '${{ runner.temp }}/VaultX Preparation Downloaded & Verified'
      - name: Verify downloaded contents and repeat native validation
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VaultX Preparation Downloaded & Verified'
          foreach ($name in @('Start-Preparation.cmd','launcher.js','status-check.js','dpapi-test.js','README.txt','SHA256SUMS.json','PROVENANCE.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $name) -PathType Leaf)) { throw 'Incomplete preparation artifact' }
          }
          node tools/staging-operator-preparation/validate-package.js "$package"
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded artifact validation failed' }
          '[Download preparation-only ZIP](${{ steps.artifact.outputs.artifact-url }})' >> $env:GITHUB_STEP_SUMMARY
