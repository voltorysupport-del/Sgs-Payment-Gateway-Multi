name: Windows provisioning compatibility

on:
  pull_request:
    branches: ['feature/step-1-project-setup', 'feature/management-*']

permissions:
  contents: read

jobs:
  windows-dpapi:
    name: Native Windows DPAPI round-trip (synthetic data only)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
      TEST_DATABASE_TOKEN: ''
      LIVE_MODE_ENABLED: 'false'
      ALLOWED_PROVIDERS: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - name: Real DPAPI encryption, protected delivery, decryption and tamper checks
        run: npm test -- tests/windows/key-delivery.test.ts tests/unit/windows-key-delivery.test.ts tests/integration/request-parsing.test.ts tests/unit/dashboard-passwords.test.ts tests/unit/dashboard-gateway-reader.test.ts tests/unit/internal-read.test.ts tests/unit/read-client.test.ts tests/unit/management-routes.test.ts

      - name: Frontend components, session flows, and accessibility (synthetic responses)
        run: npm run test:frontend
