# Runs automatically on every push and every pull request.
# A pull request should only be merged into main when both jobs are green.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

# If you push again quickly, cancel the older run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Belt and braces: CI can never run with real payments enabled.
      LIVE_MODE_ENABLED: 'false'
      ALLOWED_PROVIDERS: simulator
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependency versions from package-lock.json
        run: npm ci

      - name: Check dependencies for known high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the entire Git history for secrets
        run: gitleaks git --redact --verbose .
