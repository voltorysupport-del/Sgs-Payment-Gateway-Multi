# Local development database ONLY. Not for production.
#
# Start:  npm run db:up     (or: docker compose up -d postgres)
# Stop:   npm run db:down   (your data is kept in the "vaultx_pay_pgdata" volume)
#
# Settings are read from your local .env file (copied from .env.example).
# The password is never written in this file.

name: vaultx-pay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-vaultx_pay}
    ports:
      # Bound to 127.0.0.1 so the database is reachable only from your own computer,
      # not from other devices on your network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - vaultx_pay_pgdata:/var/lib/postgresql/data
      # Runs once, the first time the database volume is created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultx_pay_pgdata:
